<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ana 90</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="container">
        <h1>Festejamos los 90 de Ana</h1>
        <p class="subtitle">Una vida llena de momentos ✨</p>

        <div class="timeline">

            <div class="event">
                <img src="img/ana1.jpg">
                <div class="text">
                    <h2>Infancia</h2>
                    <p>Los primeros pasos de una gran historia</p>
                </div>
            </div>

            <div class="event">
                <img src="img/ana2.jpg">
                <div class="text">
                    <h2>Juventud</h2>
                    <p>Descubriendo el mundo</p>
                </div>
            </div>

            <div class="event">
                <img src="img/ana3.jpg">
                <div class="text">
                    <h2>Adultez</h2>
                    <p>Construyendo recuerdos</p>
                </div>
            </div>

            <div class="event">
                <img src="img/ana4.jpg">
                <div class="text">
                    <h2>Hoy</h2>
                    <p>90 años de amor ❤️</p>
                </div>
            </div>

        </div>
    </div>

    <audio id="music" autoplay loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
